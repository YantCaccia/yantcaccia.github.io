<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Home - MenuTracker</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic">
    <link rel="stylesheet" href="assets/css/Data-Table-1.css">
    <link rel="stylesheet" href="assets/css/Data-Table.css">
    <link rel="stylesheet" href="assets/css/Footer-Basic.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.15/css/dataTables.bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Navigation-Clean.css">
</head>

<body id="page-top">
    <nav class="navbar navbar-light navbar-expand-lg fixed-top bg-secondary text-uppercase" id="mainNav">
        <div class="container"><a class="navbar-brand js-scroll-trigger" href="https://yantcaccia.github.io/menutracker">MenuTracker</a></div>
    </nav>
    <header class="masthead bg-primary text-white text-center">
        <div class="container" style="width: 340px;">
            <form>
                <div class="form-group"><label>Com'era <label id="placeholder"></label>?</label><input class="form-control-range" type="range" id="mySlider" value="7" min="0" max="10" step="1">
                <br>
                <label>Il tuo voto: </label>
                <label id="votoLive">7</label>
                </div><button class="btn btn-primary" id="myButton" type="button" style="background: rgb(44,62,80);">Valuta!</button>
            </form>
        </div>
    </header>
    <div class="copyright py-4 text-center text-white">
        <div class="container"><small>Sto pariann 🦄</small></div>
    </div>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.15/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.15/js/dataTables.bootstrap.min.js"></script>
    <script src="assets/js/freelancer.js"></script>

    <script>
        document.getElementById("mySlider").addEventListener("change", function(){
            document.getElementById("votoLive").innerHTML = document.getElementById("mySlider").value;
        })
    </script>

    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>

    <!-- TODO: Add SDKs for Firebase products that you want to use
        https://firebase.google.com/docs/web/setup#available-libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase.js"></script>
    
    <script>
        // Your web app's Firebase configuration
        var firebaseConfig = {
            apiKey: "AIzaSyAS4uVHRMp-lNCQCj63u_R9-ImXZh3g9rg",
            authDomain: "menutracker-4bf38.firebaseapp.com",
            projectId: "menutracker-4bf38",
            storageBucket: "menutracker-4bf38.appspot.com",
            messagingSenderId: "76345663555",
            appId: "1:76345663555:web:063f578eae1b51900734f6",
            databaseURL: "https://menutracker-4bf38-default-rtdb.europe-west1.firebasedatabase.app"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        document.getElementById("myButton").addEventListener("click", myHandlerFunction);

        var idPiatto = parseInt(location.search.substring(1));
        var nomePiatto;

        database.ref('piatti/').orderByChild('id').equalTo(idPiatto).once('value').then(function(snapshot) {
            snapshot.forEach((snapshot1)=>{
                document.getElementById("placeholder").innerHTML = snapshot1.key;
                nomePiatto = snapshot1.key;
            })
        });

        function myHandlerFunction(){
            
            var voto = document.getElementById("mySlider").value;

            var punteggioTotale;
            var votiTotali;

            database.ref('piatti/' + nomePiatto).once('value').then(function(snapshot) {

                punteggioTotaleOld = snapshot.val().punteggioTotale;
                votiTotaliOld = snapshot.val().votiTotali;

                firebase.database().ref('piatti/' + nomePiatto).update({
                "punteggioTotale": parseInt(punteggioTotaleOld) + parseInt(voto),
                "votiTotali" : votiTotaliOld + 1
            }, (error) => {
                if (error) {
                    // pass
                } else {
                    // callback
                    window.location.href = 'https://yantcaccia.github.io/menutracker';
                }
                });
            });

        }

    </script>

</body>

</html>
