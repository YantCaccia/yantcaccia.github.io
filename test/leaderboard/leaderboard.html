var a = 0;
firebase.database().ref("/leaderboard").orderByChild("mscore").on("child_added", function(snapshot){
  console.log(snapshot.key + snapshot.val().mscore);
  asd = snapshot.key;
  dsa = -(snapshot.val().mscore);
  a++;
  test(asd, dsa, a);
});
function test(name, score, pos){
  var a = document.createElement("TR");
  var b = document.createElement("TD"); b.id = "nome";
  var c = document.createElement("TD"); c.id = "score";
  var f = document.createElement("TD"); f.id = "pos";
  var d = document.createTextNode(name);
  var e = document.createTextNode(score);
  var g = document.createTextNode(pos);
  b.appendChild(d);
  c.appendChild(e);
  f.appendChild(g);
  a.appendChild(f);
  a.appendChild(b);
  a.appendChild(c);
  var table = document.getElementById('tbody');
  table.appendChild(a);
}
